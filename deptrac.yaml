# The plugin's layers and which of them each may depend on.
#
# A layer is a plugin namespace (as Craft's generator lays them out), or a part of the framework or a package that only
# some layers may reach. Unlisted framework and package code is open to every layer. `deptrac debug:unassigned` fails
# for plugin classes outside any layer. Class rules (base classes, naming) live in tests/PHPStan/ArchitectureRules.php.
#
# Dependencies point inwards and never back, except entry points reaching services through the plugin, as Craft does
# with `Plugin::getInstance()`. Services get the API clients and the adapter injected through Yii's container. Deptrac
# can't see service locator calls such as `Craft::$app->getRequest()`.
#
#   Plugin           the composition root, registering components and event handlers
#   Entry points
#     Http           web controllers                                  controllers
#     Console        console controllers                              console\controllers
#     View           utilities, widgets, Twig and element actions     utilities, widgets, web\twig, variables,
#                                                                     elements\actions, elements\exporters
#     Gql            GraphQL types, queries and resolvers             gql
#     Fields         custom fields                                    fields
#     Behaviors      behaviors that extend the objects of Craft       behaviors
#     Jobs           queue jobs                                       jobs
#   Application
#     Services       components that hold the logic                  services
#   Infrastructure
#     Api            clients of the Lettermint API                    api
#     Mail           the transport adapter and its parts              mail, and the adapter at the root
#     Fs             filesystem types                                 fs
#     Records        active records                                   records
#     Elements       elements, their queries and conditions           elements
#     Migrations     schema migrations                                migrations
#     Assets         asset bundles                                    web\assets
#   Domain
#     Contracts      interfaces, and shared traits and abstract      base
#                    classes
#     Models         settings and value objects                       models
#     Validators     Yii validators                                   validators
#     Events         events that the plugin triggers                  events
#   Leaves
#     Schema         names of tables and columns                      db
#     Helpers        stateless static helpers                         helpers
#     Errors         exceptions                                       errors
#     Enums          enums                                            enums

parameters:
  plugin: 'SomehowDigital\\Craft\\Lettermint'

deptrac:
  paths:
    - ./src

  analyser:
    types:
      - class
      - class_superglobal
      - function
      - function_call
      - function_superglobal
      - use

  layers:
    - name: Plugin
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\Plugin$#'

    - name: Http
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\controllers\\#'

    - name: Console
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\console\\#'

    - name: View
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\(utilities|widgets|web\\twig|variables|elements\\actions|elements\\exporters)\\#'

    - name: Gql
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\gql\\#'

    - name: Fields
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\fields\\#'

    - name: Jobs
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\jobs\\#'

    - name: Services
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\services\\#'

    - name: Api
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\api\\#'

    - name: Mail
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\(mail\\|[A-Za-z]*Adapter$)#'

    - name: Fs
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\fs\\#'

    - name: Records
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\records\\#'

    - name: Elements
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\elements\\(?!actions\\|exporters\\)#'

    - name: Migrations
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\migrations\\#'

    - name: Assets
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\web\\assets\\#'

    - name: Contracts
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\base\\#'

    - name: Models
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\models\\#'

    - name: Behaviors
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\behaviors\\#'

    - name: Validators
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\validators\\#'

    - name: Events
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\events\\#'

    - name: Schema
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\db\\#'

    - name: Helpers
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\helpers\\#'

    - name: Errors
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\errors\\#'

    - name: Enums
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\enums\\#'

    # Not shipped, so no layer depends on them.
    - name: Tests
      collectors:
        - type: classNameRegex
          value: '#^%plugin%\\Tests\\#'

    # Wrapped by the API clients and the transport.
    - name: LettermintSdk
      collectors:
        - type: classNameRegex
          value: '#^Lettermint\\#'

    # Only for the infrastructure.
    - name: HttpClient
      collectors:
        - type: classNameRegex
          value: '#^(GuzzleHttp|Psr\\Http\\Client|Symfony\\Component\\HttpClient|Symfony\\Contracts\\HttpClient)\\#'

    # Only for the transport.
    - name: SymfonyMailer
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\Component\\(Mailer|Mime)\\#'

    # Only the plugin registers class-level handlers, so they're all in one place. Plugin events extend it.
    - name: YiiEvent
      collectors:
        - type: classNameRegex
          value: '#^yii\\base\\Event$#'

    # Only entry points read these, and pass on plain data.
    - name: WebContext
      collectors:
        - type: classNameRegex
          value: '#^((yii|craft)\\web\\(Request|Response|Session|User|UploadedFile|Cookie|CookieCollection)|craft\\console\\Request)$#'

    # For services, records, elements, migrations, and field column types.
    - name: Database
      collectors:
        - type: classNameRegex
          value: '#^(yii|craft)\\db\\#'

    # The plugin's environment, out of reach of the domain.
    - name: CraftServices
      collectors:
        - type: classNameRegex
          value: '#^craft\\services\\#'

    # Rendering stays out of the domain and the infrastructure behind the services.
    - name: Rendering
      collectors:
        - type: classNameRegex
          value: '#^((yii\\(base|web)|craft\\web)\\View$|craft\\web\\twig\\|craft\\helpers\\(Html|Cp)$|Twig\\)#'

    # Craft wraps these, so no layer reads them.
    - name: Superglobals
      collectors:
        - type: superglobal
          value:
            - _COOKIE
            - _ENV
            - _FILES
            - _GET
            - _POST
            - _REQUEST
            - _SERVER
            - _SESSION
            - GLOBALS

  ruleset:
    # Registers everything and wires the infrastructure, including the HTTP client, into the services.
    Plugin: [Http, Console, View, Gql, Fields, Behaviors, Jobs, Services, Api, Mail, Fs, Elements, Assets, Contracts, Models, Events, Helpers, Errors, Enums, YiiEvent, WebContext, CraftServices, Rendering, HttpClient]

    # Entry points stay thin: read input, call services, render output. Web controllers also render utility parts and
    # verify webhook signatures with the SDK.
    Http: [Plugin, Services, View, Elements, Assets, Contracts, Models, Helpers, Errors, Enums, WebContext, CraftServices, Rendering, LettermintSdk]
    Console: [Plugin, Services, Elements, Contracts, Models, Helpers, Errors, Enums, WebContext, CraftServices]
    View: [Plugin, Services, Elements, Assets, Contracts, Models, Helpers, Errors, Enums, CraftServices, Rendering]
    Gql: [Plugin, Services, Elements, Contracts, Models, Helpers, Errors, Enums, CraftServices]
    # Fields declare their GraphQL and column types.
    Fields: [Plugin, Services, Elements, Gql, Assets, Contracts, Models, Validators, Helpers, Errors, Enums, Database, CraftServices, Rendering]
    Behaviors: [Plugin, Services, Elements, Contracts, Models, Helpers, Errors, Enums, CraftServices]
    Jobs: [Plugin, Services, Contracts, Models, Helpers, Errors, Enums, CraftServices]

    # Services get collaborators injected, so they depend on no entry point, and don't render.
    Services: [Api, Mail, Records, Elements, Jobs, Contracts, Models, Validators, Events, Schema, Helpers, Errors, Enums, Database, CraftServices]

    # The infrastructure doesn't know the services. Adapters, filesystems and elements render their own settings and forms.
    Api: [Contracts, Models, Helpers, Errors, Enums, LettermintSdk, HttpClient]
    Mail: [Assets, Contracts, Models, Validators, Helpers, Errors, Enums, LettermintSdk, HttpClient, SymfonyMailer, Rendering]
    Fs: [Assets, Contracts, Models, Validators, Helpers, Errors, Enums, HttpClient, Rendering]
    Records: [Schema, Enums, Database]
    Elements: [Records, Contracts, Models, Validators, Events, Schema, Helpers, Errors, Enums, Database, CraftServices, Rendering]
    # Migrations depend on nothing that changes later.
    Migrations: [Schema, Database]
    Assets: ~

    # The domain depends only on itself and the leaves. Interfaces may name models, so models can't depend on them.
    Contracts: [Models, Errors, Enums]
    Models: [Validators, Helpers, Errors, Enums]
    Validators: [Helpers, Errors, Enums]
    Events: [Contracts, Models, Enums, YiiEvent]

    # Leaves depend on nothing but enums.
    Schema: ~
    Helpers: [Errors, Enums]
    Errors: [Enums]
    Enums: ~
